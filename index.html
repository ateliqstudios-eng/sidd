<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Sidd</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--blush:#f6dfe0;--rose:#d98a9c;--deep:#a8566b;--paper:#fff8f2;--gold:#c9a24b;--ink:#5b3a42}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 20%,#fbeaea,var(--blush) 70%);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;z-index:5;background:radial-gradient(circle at 50% 30%,#fbeaea,var(--blush) 75%);transition:opacity 1.2s ease,visibility 1.2s}
#gate svg{width:min(78vw,340px);height:auto;animation:sway 4s ease-in-out infinite;transition:transform 1.2s ease,opacity 1s;filter:drop-shadow(0 14px 18px rgba(168,86,107,.25))}
#gate p{font-style:italic;font-size:1.25rem;color:var(--deep);letter-spacing:.04em}
#gate.open{opacity:0;visibility:hidden}
#gate.open svg{transform:scale(1.5) translateY(-30px);opacity:0;animation:none}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:40px 18px}
#letter{position:relative;width:min(92vw,470px);background:var(--paper);padding:54px 38px 40px;box-shadow:0 2px 0 #f0e2d6,0 24px 50px rgba(120,60,75,.22);opacity:0;transform:translateY(40px) rotate(-1.2deg);transition:opacity 1.4s ease .6s,transform 1.4s ease .6s;background-image:repeating-linear-gradient(transparent 0 33px,rgba(217,138,156,.16) 33px 34px)}
#letter.show{opacity:1;transform:none}
#letter:before{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,75,.45);pointer-events:none}
.stamp{position:absolute;top:-26px;right:22px;width:92px;transform:rotate(7deg);filter:drop-shadow(0 4px 5px rgba(90,60,20,.3))}
.date{font-style:italic;font-size:1rem;color:var(--deep);margin-bottom:26px}
.to{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:2.5rem;color:var(--deep);margin-bottom:14px;line-height:1.1}
.body{font-size:1.4rem;line-height:34px;font-weight:500}
.body p+p{margin-top:34px}
.sign{margin-top:34px;font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:2.1rem;color:var(--deep);text-align:right}
.btns{margin-top:30px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:54px;position:relative}
button{font-family:inherit;font-size:1.2rem;padding:12px 30px;border-radius:40px;border:1px solid var(--deep);cursor:pointer;transition:transform .25s,background .25s}
#yes{background:var(--deep);color:#fff8f2}
#yes:hover{transform:scale(1.06);background:#8f4358}
#maybe{background:transparent;color:var(--deep)}
#thanks{display:none;text-align:center;font-style:italic;font-size:1.3rem;color:var(--deep);margin-top:18px}
.made{margin-top:26px;text-align:center;font-style:italic;font-size:.95rem;color:rgba(91,58,66,.7)}
.petal{position:fixed;top:-30px;width:14px;height:18px;background:var(--rose);border-radius:80% 0 80% 0;opacity:.8;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.2}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="gate" role="button" tabindex="0" aria-label="Tap the bouquet">
<svg viewBox="0 0 300 360" aria-hidden="true">
<defs>
<g id="fl">
<g fill="currentColor"><ellipse cx="0" cy="-17" rx="11" ry="17"/><ellipse cx="0" cy="-17" rx="11" ry="17" transform="rotate(72)"/><ellipse cx="0" cy="-17" rx="11" ry="17" transform="rotate(144)"/><ellipse cx="0" cy="-17" rx="11" ry="17" transform="rotate(216)"/><ellipse cx="0" cy="-17" rx="11" ry="17" transform="rotate(288)"/></g>
<circle r="9" fill="#fff4e6" opacity=".85"/><circle r="4" fill="#e9c27a"/>
</g>
<g id="lf"><path d="M0 0C14-18 38-16 50 0C36 16 14 16 0 0Z" fill="#8fae8b"/></g>
</defs>
<g stroke="#6f9a6d" stroke-width="4" stroke-linecap="round" fill="none">
<path d="M150 330V150"/><path d="M150 330L80 130"/><path d="M150 330L222 128"/><path d="M150 330L40 190"/><path d="M150 330L262 190"/>
</g>
<use href="#lf" transform="translate(150 250) rotate(-35)"/><use href="#lf" transform="translate(150 230) rotate(215) scale(-1 1)"/>
<use href="#lf" transform="translate(118 215) rotate(-150)"/><use href="#lf" transform="translate(185 205) rotate(-30)"/>
<use href="#fl" transform="translate(40 190) scale(1)" style="color:#f1b7c4"/>
<use href="#fl" transform="translate(262 190) scale(1)" style="color:#f1b7c4"/>
<use href="#fl" transform="translate(80 130) scale(1.15)" style="color:#e58fa6"/>
<use href="#fl" transform="translate(222 128) scale(1.15)" style="color:#e58fa6"/>
<use href="#fl" transform="translate(150 140) scale(1.5)" style="color:#d9748f"/>
<use href="#fl" transform="translate(112 195) scale(.95)" style="color:#f7d3da"/>
<use href="#fl" transform="translate(190 192) scale(.95)" style="color:#f7d3da"/>
<path d="M105 300L195 300L170 350L130 350Z" fill="#f4d9a8" opacity="0"/>
<path d="M118 292C135 306 165 306 182 292L172 336C158 342 142 342 128 336Z" fill="#fff4ea" stroke="#c9a24b" stroke-width="2"/>
<path d="M130 300C142 318 158 318 170 300" fill="none" stroke="#d98a9c" stroke-width="5" stroke-linecap="round"/>
<path d="M150 312l-16 26M150 312l16 26" stroke="#d98a9c" stroke-width="5" stroke-linecap="round"/>
</svg>
<p>tap</p>
</div>

<main>
<article id="letter">
<svg class="stamp" viewBox="0 0 100 100" aria-hidden="true">
<defs><radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#f6e08f"/><stop offset=".55" stop-color="#c9a24b"/><stop offset="1" stop-color="#9a7428"/></radialGradient></defs>
<circle cx="50" cy="50" r="44" fill="url(#g)"/>
<circle cx="50" cy="50" r="44" fill="none" stroke="#e8cf85" stroke-width="6" stroke-dasharray="4 5.2"/>
<circle cx="50" cy="50" r="33" fill="none" stroke="#8a6620" stroke-width="1.2" opacity=".7"/>
<text x="50" y="63" text-anchor="middle" font-family="Pinyon Script,cursive" font-size="44" fill="#7a5818">S</text>
<text x="50" y="26" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="9" fill="#7a5818" font-style="italic">28 · 11</text>
</svg>

<div class="date">Cape Town</div>
<div class="to">Dear Sidd,</div>
<div class="body">
<p>Will you go out with me on the 28th of November?</p>
<p>It's my last weekend before I leave.</p>
</div>
<div class="sign">Abdullah</div>

<div class="btns">
<button id="yes">Yes</button>
<button id="maybe">Maybe</button>
</div>
<div id="thanks">See you on the 28th.</div>
<div class="made">made by Abdullah, for Sidd</div>
</article>
</main>

<script>
const gate=document.getElementById('gate'),letter=document.getElementById('letter');
function petals(n){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='petal';
p.style.left=Math.random()*100+'vw';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*720)+'deg');
p.style.animationDuration=(5+Math.random()*5)+'s';p.style.animationDelay=(Math.random()*1.5)+'s';
p.style.background=['#e58fa6','#f1b7c4','#f7d3da','#d9748f'][i%4];document.body.appendChild(p);setTimeout(()=>p.remove(),12000)}}
function openGate(){if(gate.classList.contains('open'))return;gate.classList.add('open');petals(34);setTimeout(()=>letter.classList.add('show'),300)}
gate.addEventListener('click',openGate);
gate.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openGate()});
const maybe=document.getElementById('maybe');
function dodge(){const x=(Math.random()*160-80),y=(Math.random()*50-25);maybe.style.transform=`translate(${x}px,${y}px)`}
maybe.addEventListener('mouseenter',dodge);maybe.addEventListener('click',dodge);maybe.addEventListener('touchstart',e=>{e.preventDefault();dodge()});
document.getElementById('yes').addEventListener('click',()=>{
petals(40);document.getElementById('thanks').style.display='block';
const m=encodeURIComponent("Yes, I'll go out with you on the 28th 🌸 - Sidd");
setTimeout(()=>window.open('https://wa.me/27780120351?text='+m,'_blank'),900)});
</script>
</body>
</html>
